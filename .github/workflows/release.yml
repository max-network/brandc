name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install

      # RELEASING = BUMPING THE VERSION IN YOUR PR, matching worker-utils / billing / shared-ui /
      # mcp-http. This used to auto-increment the PATCH whenever package.json was not already
      # ahead, so an additive contract change shipped as 0.6.1 when it deserved a minor: the
      # workflow, not the author, decided the semver. Now the version in package.json IS the
      # release, and a merge whose version is already published is a green no-op.
      - name: Resolve version
        id: version
        run: |
          NEXT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view brandc@"$NEXT" version 2>/dev/null || true)
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          if [ -n "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "brandc $NEXT is already published — nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "brandc release version: $NEXT" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Every step below is a release action, so all are gated on the version being new.
      - name: Stamp changelog
        if: steps.version.outputs.skip == 'false'
        run: node scripts/changelog-release.mjs "${{ steps.version.outputs.next }}"

      - name: Set package version
        if: steps.version.outputs.skip == 'false'
        run: npm version "${{ steps.version.outputs.next }}" --no-git-tag-version --allow-same-version

      - name: Check
        run: npm run check

      - name: Commit and tag
        if: steps.version.outputs.skip == 'false'
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v$NEXT" || echo "nothing to commit"
          git tag "v$NEXT"
          git push origin main --tags

      - name: Publish to npm
        if: steps.version.outputs.skip == 'false'
        run: npx npm@latest publish --provenance --access public

      - name: GitHub Release
        if: steps.version.outputs.skip == 'false'
        run: gh release create "v${{ steps.version.outputs.next }}" --title "v${{ steps.version.outputs.next }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
