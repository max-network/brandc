name: Auto PR (develop → main)

on:
  push:
    branches: [develop]

jobs:
  promote:
    uses: max-network/.github/.github/workflows/auto-pr.yml@main
    with:
      head-branch: develop
      note: "Merging publishes the version in package.json to the public npm registry through release.yml, so bump it in the PR that adds the change. A version already published releases nothing."
    secrets: inherit
