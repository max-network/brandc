name: Auto PR (develop → main)

# Keeps a standing "promote develop → main" PR open after every push to `develop`, so shipping
# is a one-click merge.
#
#   feature branch ──PR──> develop ──(this)──> standing PR ──merge──> main ──> publish
#
# Now calls the org's shared definition in max-network/.github. The file this replaces said it
# was "Copied from max-network/worker-utils' auto-pr.yml ... rather than reinvented" — the right
# instinct aimed at a copy, and it was the last one left in the org.
#
# release.yml is deliberately NOT shared: brandc publishes to the PUBLIC npm registry, while the
# shared publish workflow targets GitHub Packages under the @max-network scope.
on:
  push:
    branches: [develop]

jobs:
  promote:
    uses: max-network/.github/.github/workflows/auto-pr.yml@main
    with:
      head-branch: develop
      title: "🚀 Promote develop → main"
      body: |
        Standing promotion PR, kept up to date by `auto-pr.yml`.

        **Merging this publishes `brandc` to the public npm registry.** `release.yml` runs on
        push to `main` and ships whatever `package.json` says, so bump the version in the PR
        that adds the change rather than here. A merge whose version is already published
        publishes nothing and says so in the run summary, which keeps a docs- or CI-only
        merge green.
    secrets: inherit
