name: CI

# The quality gate. Runs on both integration branches and on every PR, so a change is checked
# where it lands (develop) as well as where it ships (main).
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
